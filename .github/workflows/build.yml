name: Build and Release DitPlex

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Sanitize Version Tag
        id: version
        shell: bash
        run: |
          TAG_CLEAN=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^v//')
          if [[ ! "$TAG_CLEAN" =~ ^[0-9] ]]; then
            TAG_CLEAN="1.4.0"
          fi
          echo "CLEAN_VERSION=${TAG_CLEAN}" >> $GITHUB_ENV

      - name: Build Windows Exe
        shell: bash
        run: python Scripts/build.py --clean --isolated --name "DitPlex-${CLEAN_VERSION}"

      - name: Smoke test executable
        shell: bash
        run: |
          EXE="dist/DitPlex-${CLEAN_VERSION}.exe"
          "$EXE" -v
          OUT=$("$EXE" -t "SOS" | tr -d '\r')
          [ "$OUT" = "... --- ..." ] || { echo "Saida inesperada em -t: $OUT"; exit 1; }
          OUT=$("$EXE" -m "-.-. .-" | tr -d '\r')
          [ "$OUT" = "CA" ] || { echo "Saida inesperada em -m: $OUT"; exit 1; }

      - name: Report executable size
        shell: bash
        run: |
          ls -lh dist/
          pyi-archive_viewer -l "dist/DitPlex-${CLEAN_VERSION}.exe" < /dev/null || true

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: DitPlex-Windows
          path: dist/*.exe
          if-no-files-found: error

  build-linux-packages:
    name: Build Linux Native Packages (DEB, RPM, Arch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            ruby ruby-dev build-essential rpm zstd libarchive-tools

      - name: Install FPM Gem
        run: |
          sudo gem install --no-document fpm

      - name: Install PyInstaller and Build Linux Binary
        run: |
          python -m pip install --upgrade pip pyinstaller
          python Scripts/build.py --clean --isolated

      - name: Smoke test Linux binary
        run: |
          BIN="dist/DitPlex"
          [ -f "$BIN" ] || BIN="dist/ditplex"
          "$BIN" -v
          OUT=$("$BIN" -t "SOS")
          [ "$OUT" = "... --- ..." ] || { echo "Saida inesperada em -t: $OUT"; exit 1; }
          OUT=$("$BIN" -m "-.-. .-")
          [ "$OUT" = "CA" ] || { echo "Saida inesperada em -m: $OUT"; exit 1; }
          ls -lh dist/

      - name: Prepare Packaging Structure
        run: |
          mkdir -p pkg_root/usr/bin
          mkdir -p pkg_root/usr/share/applications
          mkdir -p pkg_root/usr/share/icons/hicolor/256x256/apps

          if [ -f "dist/DitPlex" ]; then
            cp dist/DitPlex pkg_root/usr/bin/DitPlex
          elif [ -f "dist/ditplex" ]; then
            cp dist/ditplex pkg_root/usr/bin/DitPlex
          else
            cp dist/* pkg_root/usr/bin/DitPlex
          fi
          chmod +x pkg_root/usr/bin/DitPlex

          if [ -f "ditplex.desktop" ]; then
            cp ditplex.desktop pkg_root/usr/share/applications/ditplex.desktop
          else
            echo "[Desktop Entry]" > pkg_root/usr/share/applications/ditplex.desktop
            echo "Name=DitPlex" >> pkg_root/usr/share/applications/ditplex.desktop
            echo "Exec=DitPlex" >> pkg_root/usr/share/applications/ditplex.desktop
            echo "Icon=ditplex" >> pkg_root/usr/share/applications/ditplex.desktop
            echo "Type=Application" >> pkg_root/usr/share/applications/ditplex.desktop
            echo "Terminal=true" >> pkg_root/usr/share/applications/ditplex.desktop
          fi

          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png pkg_root/usr/share/icons/hicolor/256x256/apps/ditplex.png
          elif [ -f "logo.png" ]; then
            cp logo.png pkg_root/usr/share/icons/hicolor/256x256/apps/ditplex.png
          fi

      - name: Sanitize Version Tag
        id: version
        run: |
          TAG_CLEAN=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^v//')
          if [[ ! "$TAG_CLEAN" =~ ^[0-9] ]]; then
            TAG_CLEAN="1.4.0"
          fi
          echo "CLEAN_VERSION=${TAG_CLEAN}" >> $GITHUB_ENV

      - name: Build DEB Package
        run: |
          fpm -s dir -t deb \
            -n DitPlex \
            -v "$CLEAN_VERSION" \
            -C pkg_root \
            --prefix / \
            --description "Utilitario DitPlex"

      - name: Build RPM Package
        run: |
          fpm -s dir -t rpm \
            -n DitPlex \
            -v "$CLEAN_VERSION" \
            -C pkg_root \
            --prefix / \
            --description "Utilitario DitPlex"

      - name: Build Arch Linux Package
        run: |
          fpm -s dir -t pacman \
            -n DitPlex \
            -v "$CLEAN_VERSION" \
            -C pkg_root \
            --prefix / \
            --description "Utilitario DitPlex"

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DitPlex-Debian-Ubuntu
          path: "*.deb"

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DitPlex-Fedora-RPM
          path: "*.rpm"

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DitPlex-ArchLinux
          path: "*.pkg.tar.*"

  build-flatpak:
    name: Build Flatpak Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and Build Linux Binary
        run: |
          python -m pip install --upgrade pip pyinstaller
          python Scripts/build.py --clean --isolated

      - name: Install Flatpak Builder and ImageMagick
        run: |
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y flatpak flatpak-builder imagemagick

      - name: Add Flathub Repository and Runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Resize Icon and Fix Desktop File for Flatpak
        run: |
          if [ -f "assets/logo.png" ]; then
            convert assets/logo.png -resize "256x256!" assets/logo.png
          elif [ -f "logo.png" ]; then
            convert logo.png -resize "256x256!" logo.png
          fi

          if [ -f "ditplex.desktop" ]; then
            sed -i 's/Icon=.*/Icon=org.ditplex.DitPlex/' ditplex.desktop
          fi

      - name: Build Flatpak App
        run: |
          TAG_CLEAN=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^v//')
          if [[ ! "$TAG_CLEAN" =~ ^[0-9] ]]; then
            TAG_CLEAN="1.4.0"
          fi
          flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build-dir org.ditplex.DitPlex.yml
          flatpak build-bundle repo "DitPlex-${TAG_CLEAN}.flatpak" org.ditplex.DitPlex

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DitPlex-Flatpak
          path: "*.flatpak"

  release:
    name: Publish Github Release
    needs: [build-windows, build-linux-packages, build-flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DitPlex-Windows
          path: release_files/

      - name: Download DEB Artifact
        uses: actions/download-artifact@v4
        with:
          name: DitPlex-Debian-Ubuntu
          path: release_files/

      - name: Download RPM Artifact
        uses: actions/download-artifact@v4
        with:
          name: DitPlex-Fedora-RPM
          path: release_files/

      - name: Download Arch Artifact
        uses: actions/download-artifact@v4
        with:
          name: DitPlex-ArchLinux
          path: release_files/

      - name: Download Flatpak Artifact
        uses: actions/download-artifact@v4
        with:
          name: DitPlex-Flatpak
          path: release_files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}